name: Run Rest Assured API Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Jogosultságok a GitHub Pages híváshoz és az ID tokenhez
permissions:
  contents: read
  pages: write
  id-token: write

# Biztosítja, hogy egyszerre csak egy deployment fusson
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout repository
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Set up Java 21
      # =========================
      - name: Set up JDK21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: 'maven'

      # =========================
      # Run Maven tests
      # =========================
      - name: Run Maven Tests
        run: ./mvnw -B clean test -DCI=true

      # =========================
      # Upload Surefire test reports
      # =========================
      - name: Upload surefire test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports

      # =========================
      # Generate Allure Report
      # =========================
      - name: Generate Allure Report
        if: always()
        run: ./mvnw allure:report

      # =========================
      # Prepare GitHub Pages folder
      # =========================
      - name: Prepare GitHub Pages folder
        if: always()
        run: |
          rm -rf public
          mkdir -p public

          cp -r target/site/allure-maven-plugin/* public/
          
          # Kikapcsoljuk a Jekyll feldolgozást, hogy az Allure JS/CSS fájljai hiánytalanul betöltsenek
          touch public/.nojekyll

      # =========================
      # Upload artifact for GitHub Pages
      # =========================
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  # külön deployment job a tisztább felépítésért
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
